---
applications:
- name: freight-price-portal
  memory: 256M
  instances: 1
  buildpacks:
    - nodejs_buildpack
  command: node server/index.js
  # Database: DATABASE_URL, set on the app with `cf set-env` (never here — this
  # file is committed). To use a BTP PostgreSQL instance instead, create it and
  # add `services: [freight-portal-db]`; a bound service wins over DATABASE_URL.
  env:
    NODE_ENV: production
    TZ: Asia/Karachi
    # All-roles test accounts (server/roles.js) for user testing. Remove
    # before go-live: one person holding every role can approve their own work.
    ENABLE_TEST_ACCOUNTS: "true"
    # Approval emails (server/approvalEmails.js). Off until SMTP_HOST and
    # MAIL_FROM are set — set them, and SMTP_USER / SMTP_PASS, with
    # `cf set-env` (never here). E.g. Microsoft 365: SMTP_HOST=smtp.office365.com,
    # SMTP_PORT=587, MAIL_FROM=the sending mailbox. Approvers' addresses come
    # from SuccessFactors at their sign-in, or "email" in server/roles.js.
    # APP_URL: the portal's address, for the link in each email.
    # Reminders: once something has waited REMINDER_AFTER_HOURS (default 24),
    # then every REMINDER_EVERY_HOURS (default 24), Mon–Sat 09:00–18:00.
